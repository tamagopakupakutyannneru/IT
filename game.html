<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ゲーム開発 | IT会社</title>

</head>

<body>

    <!-- ヘッダー -->
    <header>
        <h1>ゲーム開発 IT会社</h1>

        <nav>
            <a href="index.html">ホーム</a>
            <a href="index.html#about">会社情報</a>
            <a href="game.html">ゲーム開発</a>
            <a href="index.html#contact">お問い合わせ</a>
        </nav>
    </header>


    <!-- メイン -->
    <main>

        <section class="hero">
            <h2>ゲーム開発</h2>
            <p>ゲーム開発</p>
        </section>

<img src="syte_chara.png"
             alt="<こんにちは☆"
             class="game-character">

        <!-- 開発中のゲーム -->
        <section>
            <h2> ゲーム</h2>

            <div class="card">

                <h3>トレジャーアドベンチャー</h3>

                    現在、IT会社では新しいゲームを開発しています。
                </p>

                <p>
                    詳細情報は開発が進み次第、順次公開していきます。
                </p>

            </div>
        </section>


        <!-- 開発進捗 -->
        <section>
            <h2>開発情報 </h2>

            <div class="card">

                <h3>企画</h3>
                <progress value="8.5" max="100"></progress>

                <h3>ゲームシステム</h3>
                <progress value="10" max="100"></progress>
                <p>10%</p>


                <h3>グラフィック</h3>
                <progress value="5" max="100"></progress>
                <p>5%</p>


                <h3>サウンド</h3>
                <progress value="30" max="100"></progress>
                <p>20%</p>

            </div>
        </section>


        <!-- 開発日誌 -->
        <section>
            <h2>ブログ</h2>

            <div class="card">

                <h3>2026/09/09</h3>
                <p>
                    ゲーム開発ページを公開しました。
                </p>

                       </div>
        </section>

    </main>


    <!-- フッター -->
    <footer>

    </footer>
